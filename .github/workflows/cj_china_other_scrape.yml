name: Run Movie Crawler (Auto Sync)

on:
  workflow_dispatch: # 手动触发运行
  # schedule:
  #   - cron: '0 */3 * * *' # 可选：如果要彻底自动化，可以配置为每3小时自动运行一次

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install curl_cffi beautifulsoup4

    - name: Run Crawler Script
      run: python scraper.py

    - name: Commit and Push queue and results back to GitHub
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add queue.json results/
        
        # 仅在有修改时才提交，防止空提交导致报错
        git diff --quiet && git diff --staged --quiet || git commit -m "Automated crawl batch - $(date +'%Y-%m-%d %H:%M:%S')"
        git push
